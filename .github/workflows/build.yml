name: Build and Release

on:
  push:
    branches:
      - 'unstable'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: "**/*.sum"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: ./gradlew assembleRelease -PversionName=${{ github.event.inputs.tag_name }}

      - name: Rename APKs
        run: |
          cd app/build/outputs/apk/release
          # Rename each split APK, e.g., app-arm64-v8a-debug.apk -> vkturn-v1.0.0-arm64-v8a-debug.apk
          for apk in *.apk; do
            mv "$apk" "vkturn-${{ github.event.inputs.tag_name }}-${apk#app-}"
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
