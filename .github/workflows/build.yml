name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: "**/*.sum"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get Version from Tag
        if: startsWith(github.event.ref, 'refs/tags/v')
        id: tagver
        uses: ChrSchu90/GitTagSemanticVersion@v1.1

      - name: Build APKs
        run: ./gradlew assembleRelease -PversionName=${{ steps.tagver.outputs.version }}

      - name: Rename APKs
        run: |
          cd app/build/outputs/apk/release
          # Rename each split APK, e.g., app-arm64-v8a-debug.apk -> vkturn-v1.0.0-arm64-v8a-debug.apk
          for apk in *.apk; do
            mv "$apk" "vkturn-${{ steps.tagver.outputs.version }}-${apk#app-}"
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          tag: ${{ steps.tagver.outputs.version }}
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
